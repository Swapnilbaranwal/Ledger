# Generate the Xcode project:  brew install xcodegen && xcodegen generate && open Ledger.xcodeproj
name: Ledger
options:
  bundleIdPrefix: com.swapnil
  deploymentTarget:
    iOS: "17.0"
targets:
  Ledger:
    type: application
    platform: iOS
    sources: [Ledger]
    info:
      path: Ledger/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Connects to the Ledger agent server on your Mac.
        NSMicrophoneUsageDescription: Ledger listens when you tap the mic so you can talk to your AI COO.
        NSSpeechRecognitionUsageDescription: Ledger turns your voice into requests for your AI COO.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true   # hackathon only: allows ws:// to your laptop / ngrok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swapnil.ledger
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
