VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api-m.sandbox.paypal.com
METHODS:
  partner_referrals.customer.partnerReferrals.create:
    SUMMARY: Create partner referral
    DESC: Creates a partner referral that is shared by the partner or API caller. The partner referral is used to onboard the seller, and contains the seller's personal, business, financial and operations.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/customer/partner-referrals
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: OBJECT
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: OBJECT
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(create_referral_data_response)
        RETURNVAR: partner_referrals_customer_partnerReferrals_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: partner_referrals_customer_partnerReferrals_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(partner-referrals.create_Error400)
        STATUS: 400
        WHEN: Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(partner-referrals.create_Error401)
        STATUS: 401
        WHEN: The API call is not authorized. (HTTP 401)
      - TYPE: STRUCT(partner-referrals.create_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions or missing scopes on the caller account. (HTTP 403)
      - TYPE: STRUCT(partner-referrals.create_Error422)
        STATUS: 422
        WHEN: The caller is not a business account or the account is closed or locked. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: partner_referrals.customer.partnerReferrals.create
  partner_referrals.customer.partnerReferrals.get:
    SUMMARY: Show referral data
    DESC: Shows details by ID for referral data that was shared by the partner or API caller.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/customer/partner-referrals/{partner_referral_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - partner_referral_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(referral_data_response)
        RETURNVAR: partner_referrals_customer_partnerReferrals_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: partner_referrals_customer_partnerReferrals_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(partner-referrals.read_Error401)
        STATUS: 401
        WHEN: The API call is not authorized. (HTTP 401)
      - TYPE: STRUCT(partner-referrals.read_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions or missing scopes on the caller Account. (HTTP 403)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: partner_referrals.customer.partnerReferrals.get
