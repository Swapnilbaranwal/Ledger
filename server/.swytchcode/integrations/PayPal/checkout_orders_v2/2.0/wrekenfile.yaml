          DEFAULT: return=minimal
      - PayPal-Client-Metadata-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - id:
          TYPE: STRING
          LOCATION: path
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(order_authorize_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_authorize_create
        STATUS: 200
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_authorize_create_201
        STATUS: 201
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_authorize_create_202
        STATUS: 202
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_authorize_create_207
        STATUS: 207
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_authorize_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized. (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: STRUCT(error)
