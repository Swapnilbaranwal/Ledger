      - TYPE: STRUCT(error)
        STATUS: 409
        WHEN: The request could not be completed due to a conflict with the current state of the resource. The HTTP `409 Conflict` status code is returned when the requested operation is not allowed because the order or one or more purchase units are in a state that prevents the operation. (HTTP 409)
