        WHEN: Internal Server Error. (HTTP 500)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.confirmPaymentSource.create
  orders.checkout.authorize.create:
    SUMMARY: Authorize payment for order
    DESC: Authorizes payment for an order. To successfully authorize payment for an order, the buyer must first approve the order or a valid payment_source must be provided in the request. A buyer can approve the order upon being redirected to the rel:approve URL that was returned in the HATEOAS links in the create order response.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#authorize-order">Orders v2 errors</a>.</blockquote>
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/checkout/orders/{id}/authorize
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(order_authorize_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PayPal-Request-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Prefer:
          TYPE: STRING
