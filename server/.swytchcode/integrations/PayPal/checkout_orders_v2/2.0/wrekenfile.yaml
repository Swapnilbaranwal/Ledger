        STATUS: 201
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_capture_create_202
        STATUS: 202
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_capture_create_207
        STATUS: 207
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_capture_create_NaN
