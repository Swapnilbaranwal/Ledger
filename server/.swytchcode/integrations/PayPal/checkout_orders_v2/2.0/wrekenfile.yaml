          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - id:
          TYPE: STRING
          LOCATION: path
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
