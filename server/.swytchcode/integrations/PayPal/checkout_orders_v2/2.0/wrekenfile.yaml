          TYPE: STRING
          LOCATION: path
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: ANY
          REQUIRED: false
          LOCATION: body
