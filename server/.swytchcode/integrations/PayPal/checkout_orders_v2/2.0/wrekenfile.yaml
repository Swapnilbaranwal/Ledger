  orders.checkout.trackers.update:
    SUMMARY: Update or cancel tracking information for an order
    DESC: Updates or cancels the tracking information for a PayPal order, by ID. Updatable attributes or objects:<br/><br/><table><thead><th>Attribute</th><th>Op</th><th>Notes</th></thead><tbody></tr><tr><td><code>items</code></td><td>replace</td><td>Using replace op for <code>items</code> will replace the entire <code>items</code> object with the value sent in request.</td></tr><tr><td><code>notify_payer</code></td><td>replace, add</td><td></td></tr><tr><td><code>status</code></td><td>replace</td><td>Only patching status to CANCELLED is currently supported.</td></tr></tbody></table>
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v2/checkout/orders/{id}/trackers/{tracker_id}
      HEADERS:
        Content-Type: application/json
