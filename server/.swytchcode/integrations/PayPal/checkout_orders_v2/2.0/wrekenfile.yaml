  orders.checkout.orderUpdateCallback.create:
    SUMMARY: Receive updated order information via callback URL
    DESC: The documentation for this 'endpoint' is different from the other endpoints under v2 Orders. For this endpoint the role of client and server is reversed. The client sending the request is PayPal, and the server sending the response is the merchant. In the request, PayPal will send the buyer's redacted shipping address and selected shipping option to the callback URL defined the create order request. The response from the merchant will update the Orders resource.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/checkout/orders/order-update-callback
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(order_update_callback_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(order_update_callback_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(order_update_callback_response)
        RETURNVAR: orders_checkout_orderUpdateCallback_create
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_orderUpdateCallback_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(order_update_callback_error_response)
        STATUS: 400
        WHEN: The request is not well-formed, is syntactically incorrect, or violates the schema. (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized. (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: STRUCT(order_update_callback_error_response)
        STATUS: 422
        WHEN: The requested action could not be completed, was semantically incorrect, or failed business validation. (HTTP 422)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Internal Server Error. (HTTP 500)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.orderUpdateCallback.create
STRUCTS:
  token:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The PayPal-generated ID for the token.
    - name: type
      type: STRING
