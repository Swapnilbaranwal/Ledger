        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.authorize.create
  orders.checkout.capture.create:
    SUMMARY: Capture payment for order
    DESC: Captures payment for an order. To successfully capture payment for an order, the buyer must first approve the order or a valid payment_source must be provided in the request. A buyer can approve the order upon being redirected to the rel:approve URL that was returned in the HATEOAS links in the create order response.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#capture-order">Orders v2 errors</a>.</blockquote>
