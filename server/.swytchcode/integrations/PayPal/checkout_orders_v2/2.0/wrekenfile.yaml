VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api-m.paypal.com
METHODS:
  orders.checkout.orders.create:
    SUMMARY: Create order
    DESC: Creates an order. Merchants and partners can add Level 2 and 3 data to payments to reduce risk and payment processing costs. For more information about processing payments, see <a href="https://developer.paypal.com/docs/checkout/advanced/processing/">checkout</a> or <a href="https://developer.paypal.com/docs/multiparty/checkout/advanced/processing/">multiparty checkout</a>.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#create-order">Orders v2 errors</a>.</blockquote>
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/checkout/orders
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(order_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PayPal-Request-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Partner-Attribution-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Client-Metadata-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Prefer:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: return=minimal
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(order_request)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_orders_create
        STATUS: 200
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_orders_create_201
        STATUS: 201
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_orders_create_202
        STATUS: 202
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_orders_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized. (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: STRUCT(error)
        STATUS: 422
        WHEN: The requested action could not be performed, semantically incorrect, or failed business validation. (HTTP 422)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Internal Server Error. (HTTP 500)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.orders.create
  orders.checkout.orders.get:
    SUMMARY: Show order details
    DESC: Shows details for an order, by ID.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#get-order">Orders v2 errors</a>.</blockquote>
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/checkout/orders/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          LOCATION: path
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: OBJECT
        RETURNVAR: orders_checkout_orders_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_orders_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized. (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Not Found. (HTTP 404)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Internal Server Error. (HTTP 500)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.orders.get
  orders.checkout.orders.update:
    SUMMARY: Update order
    DESC: "Updates an order with a `CREATED` or `APPROVED` status. You cannot update an order with the `COMPLETED` status.<br/><br/>To make an update, you must provide a `reference_id`. If you omit this value with an order that contains only one purchase unit, PayPal sets the value to `default` which enables you to use the path: <code>\\\"/purchase_units/@reference_id=='default'/{attribute-or-object}\\\"</code>. Merchants and partners can add Level 2 and 3 data to payments to reduce risk and payment processing costs. For more information about processing payments, see <a href=\"https://developer.paypal.com/docs/checkout/advanced/processing/\">checkout</a> or <a href=\"https://developer.paypal.com/docs/multiparty/checkout/advanced/processing/\">multiparty checkout</a>.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a href=\"https://developer.paypal.com/api/rest/reference/orders/v2/errors/#patch-order\">Orders v2 errors</a>.</blockquote>Patchable attributes or objects:<br/><br/><table><thead><th>Attribute</th><th>Op</th><th>Notes</th></thead><tbody><tr><td><code>intent</code></td><td>replace</td><td></td></tr><tr><td><code>payer</code></td><td>replace, add</td><td>Using replace op for <code>payer</code> will replace the whole <code>payer</code> object with the value sent in request.</td></tr><tr><td><code>purchase_units</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].custom_id</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].description</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].payee.email</code></td><td>replace</td><td></td></tr><tr><td><code>purchase_units[].shipping.name</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].shipping.email_address</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].shipping.phone_number</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].shipping.options</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].shipping.address</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].shipping.type</code></td><td>replace, add</td><td></td></tr><tr><td><code>purchase_units[].soft_descriptor</code></td><td>replace, remove</td><td></td></tr><tr><td><code>purchase_units[].amount</code></td><td>replace</td><td></td></tr><tr><td><code>purchase_units[].items</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].invoice_id</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].payment_instruction</code></td><td>replace</td><td></td></tr><tr><td><code>purchase_units[].payment_instruction.disbursement_mode</code></td><td>replace</td><td>By default, <code>disbursement_mode</code> is <code>INSTANT</code>.</td></tr><tr><td><code>purchase_units[].payment_instruction.payee_receivable_fx_rate_id</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].payment_instruction.platform_fees</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].supplementary_data.airline</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>purchase_units[].supplementary_data.card</code></td><td>replace, add, remove</td><td></td></tr><tr><td><code>application_context.client_configuration</code></td><td>replace, add</td><td></td></tr></tbody></table>"
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v2/checkout/orders/{id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: ANY
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          LOCATION: path
      - Authorization:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - PayPal-Auth-Assertion:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: ANY
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: orders_checkout_orders_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized. (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Not Found. (HTTP 404)
      - TYPE: STRUCT(error)
        STATUS: 422
        WHEN: The requested action could not be performed, semantically incorrect, or failed business validation. (HTTP 422)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Internal Server Error. (HTTP 500)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Default response. (HTTP default)
    CANONICAL_ID: orders.checkout.orders.update
