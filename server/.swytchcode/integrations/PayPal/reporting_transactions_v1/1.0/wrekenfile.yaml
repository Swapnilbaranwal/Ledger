  balances_response:
    - name: balances
      type: ANY
      REQUIRED: false
    - name: account_id
      type: STRING
      REQUIRED: false
    - name: as_of_time
      type: STRING
      REQUIRED: false
      comment: The requested date and time or the last date and time when the balances can be served, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
    - name: last_refresh_time
      type: STRING
      REQUIRED: false
      comment: The date and time when the balances was last refreshed, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
