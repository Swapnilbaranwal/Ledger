VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api-m.sandbox.paypal.com
METHODS:
  transaction_search.reporting.transactions.list:
    SUMMARY: List transactions
    DESC: Lists transactions. Specify one or more query parameters to filter the transaction that appear in the response.<blockquote><strong>Notes:</strong> <ul><li>If you specify one or more optional query parameters, the <code>ending_balance</code> response field is empty.</li><li>It takes a maximum of three hours for executed transactions to appear in the list transactions call.</li><li>This call lists transaction for the previous three years.</li></ul></blockquote>
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/reporting/transactions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - transaction_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - transaction_type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - transaction_status:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - transaction_amount:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - transaction_currency:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - start_date:
          TYPE: STRING
          LOCATION: query
      - end_date:
          TYPE: STRING
          LOCATION: query
      - payment_instrument_type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - store_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - terminal_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: transaction_info
      - balance_affecting_records_only:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: "Y"
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 100
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 1
    RETURNS:
      - RETURNTYPE: STRUCT(search_response)
        RETURNVAR: transaction_search_reporting_transactions_list
        STATUS: 200
        PAGINATION:
          TYPE: page
          PAGE_SIZE_FIELD: limit
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: transaction_search_reporting_transactions_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: transaction_search.reporting.transactions.list
  transaction_search.reporting.balances.list:
    SUMMARY: List all balances
    DESC: List all balances. Specify date time to list balances for that time that appear in the response.<blockquote><strong>Notes:</strong> <ul><li>It takes a maximum of three hours for balances to appear in the list balances call.</li><li>This call lists balances upto the previous three years.</li></ul></blockquote>
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/reporting/balances
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - as_of_time:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - currency_code:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(balances_response)
        RETURNVAR: transaction_search_reporting_balances_list
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: transaction_search_reporting_balances_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: The request is not well-formed, is syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(error_403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions. (HTTP 403)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: transaction_search.reporting.balances.list
