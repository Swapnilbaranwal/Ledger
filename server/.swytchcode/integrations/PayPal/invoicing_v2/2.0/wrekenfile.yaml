VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api-m.sandbox.paypal.com
METHODS:
  invoices.invoicing.invoices.create:
    SUMMARY: Create draft invoice
    DESC: Creates a draft invoice. To move the invoice from a draft to payable state, you must <a href="#invoices_send">send the invoice</a>.<br/><br/>In the JSON request body, include invoice details including merchant information. The <code>invoice</code> object must include an <code>items</code> array.<blockquote><strong>Note:</strong> The merchant that you specify in an invoice must have a PayPal account in good standing.</blockquote>.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(invoice)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(invoice)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(invoice)
        RETURNVAR: invoices_invoicing_invoices_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_invoices_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.create_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(error_403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(invoices.create_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.create
  invoices.invoicing.invoices.list:
    SUMMARY: List invoices
    DESC: Lists invoices. To filter the invoices that appear in the response, you can specify one or more optional query parameters.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/invoicing/invoices
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 1
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 20
      - total_required:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: all
    RETURNS:
      - RETURNTYPE: STRUCT(invoices)
        RETURNVAR: invoices_invoicing_invoices_list
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_invoices_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.list_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(error_403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.list
  invoices.invoicing.send.create:
    SUMMARY: Send invoice
    DESC: Sends or schedules an invoice, by ID, to be sent to a customer. The action depends on the invoice issue date:<ul><li>If the invoice issue date is current or in the past, sends the invoice immediately.</li><li>If the invoice issue date is in the future, schedules the invoice to be sent on that date.</li></ul>To suppress the merchant's email notification, set the `send_to_invoicer` body parameter to `false`. To send the invoice through a share link and not through PayPal, set the <code>send_to_recipient</code> parameter to <code>false</code> in the <code>notification</code> object. The <code>send_to_recipient</code> parameter does not apply to a future issue date because the invoice is scheduled to be sent through PayPal on that date.<blockquote><strong>Notes:</strong><ul><li>After you send an invoice, resending it has no effect.</li><li>To send a notification for updates, <a href="#invoices_update">update the invoice</a> and set the <code>send_to_recipient</code> body parameter to <code>true</code>.</li></ul></blockquote>
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/send
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(notification)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(notification)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(link_description)
        RETURNVAR: invoices_invoicing_send_create
        STATUS: 200
      - RETURNTYPE: STRUCT(link_description)
        RETURNVAR: invoices_invoicing_send_create_202
        STATUS: 202
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_send_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(error_403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(error_422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.send.create
  invoices.invoicing.remind.create:
    SUMMARY: Send invoice reminder
    DESC: Sends a reminder to the payer about an invoice, by ID. In the JSON request body, include a `notification` object that defines the subject of the reminder and other details. <blockquote><strong>Notes:</strong><ul><li>API caller can send only 2 reminders in a day.</li></ul></blockquote>.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/remind
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(notification)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(notification)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_remind_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.remind_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.remind_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.remind_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.remind.create
  invoices.invoicing.invoices.cancel:
    SUMMARY: Cancel sent invoice
    DESC: "Cancels a sent invoice, by ID, and, optionally, sends a notification about the cancellation to the payer, merchant, and CC: emails."
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/cancel
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(notification)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(notification)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_invoices_cancel_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.cancel_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.cancel_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.cancel_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.cancel
  invoices.invoicing.payments.create:
    SUMMARY: Record payment for invoice
    DESC: Records a payment for the invoice. If no payment is due, the invoice is marked as `PAID`. Otherwise, the invoice is marked as `PARTIALLY PAID`.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/payments
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(payment_detail)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(payment_detail)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(payment_reference)
        RETURNVAR: invoices_invoicing_payments_create
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_payments_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.payments_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.payments_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.payments_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.payments.create
  invoices.invoicing.payments.delete:
    SUMMARY: Delete external payment
    DESC: Deletes an external payment, by invoice ID and transaction ID.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/payments/{transaction_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - transaction_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_payments_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.payments-delete_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.payments-delete_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.payments.delete
  invoices.invoicing.refunds.create:
