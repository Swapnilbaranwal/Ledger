        RETURNVAR: invoices_invoicing_invoices_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.get_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.get
  invoices.invoicing.invoices.update:
    SUMMARY: Fully update invoice
    DESC: Fully updates an invoice, by ID. In the JSON request body, include a complete `invoice` object. This call does not support partial updates. <blockquote><strong>Notes:</strong><ul><li>API caller can change/modify recipient only 2 times in 72 hours.</li></ul></blockquote>.
    HTTP:
      METHOD: PUT
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(invoice)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - send_to_recipient:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: true
      - send_to_invoicer:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: true
      - body:
          TYPE: STRUCT(invoice)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(invoice)
        RETURNVAR: invoices_invoicing_invoices_update
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_invoices_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.update_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.update_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.update_Error422)
        STATUS: 422
        WHEN: Unprocessable Entity. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.update
  invoices.invoicing.invoices.delete:
    SUMMARY: Delete invoice
    DESC: Deletes a draft or scheduled invoice, by ID. Deletes invoices in the draft or scheduled state only. For invoices that have already been sent, you can <a href="/docs/api/invoicing/v2/#invoices_cancel">cancel the invoice</a>. After you delete a draft or scheduled invoice, you can no longer use it or show its details. However, you can reuse its invoice number.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_invoices_delete_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.delete_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.invoices.delete
  invoices.invoicing.searchInvoices.create:
    SUMMARY: Search for invoices
    DESC: Searches for and lists invoices that match search criteria. If you pass multiple criteria, the response lists invoices that match all criteria.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/search-invoices
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
