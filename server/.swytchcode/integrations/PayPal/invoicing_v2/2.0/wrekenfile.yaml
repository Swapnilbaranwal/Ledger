      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_refunds_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(invoices.refunds_Error400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(invoices.refunds_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(invoices.refunds_Error422)
