    CANONICAL_ID: invoices.invoicing.refunds.create
  invoices.invoicing.refunds.delete:
    SUMMARY: Delete external refund
    DESC: Deletes an external refund, by invoice ID and transaction ID.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/refunds/{transaction_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - transaction_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_refunds_delete_NaN
