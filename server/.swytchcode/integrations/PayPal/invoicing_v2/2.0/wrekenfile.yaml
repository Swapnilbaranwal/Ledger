      - TYPE: STRUCT(invoices.refunds-delete_Error403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_404)
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.refunds.delete
  invoices.invoicing.generateQrCode.create:
    SUMMARY: Generate QR code
    DESC: Generates a QR code for an invoice, by ID. The QR code is a PNG image in <a href="https://www.base64encode.org/">Base64-encoded</a> format that corresponds to the invoice ID. You can generate a QR code for an invoice and add it to a paper or PDF invoice. When customers use their mobile devices to scan the QR code, they are redirected to the PayPal mobile payment flow where they can view the invoice and pay online with PayPal or a credit card. Before you get a QR code, you must <a href="#invoices_create">create an invoice</a> and <a href="#invoices_send">send an invoice</a> to move the invoice from a draft to payable state. Do not include an email address if you do not want the invoice emailed.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/invoices/{invoice_id}/generate-qr-code
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(qr_config)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - invoice_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(qr_config)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_generateQrCode_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: ANY
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Resource Not Found. (HTTP 404)
      - TYPE: ANY
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.generateQrCode.create
  invoices.invoicing.generateNextInvoiceNumber.create:
    SUMMARY: Generate invoice number
    DESC: Generates the next invoice number that is available to the merchant. The next invoice number uses the prefix and suffix from the last invoice number and increments the number by one. For example, the next invoice number after `INVOICE-1234` is `INVOICE-1235`.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/invoicing/generate-next-invoice-number
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(fetchtype)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(fetchtype)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(invoice_number)
        RETURNVAR: invoices_invoicing_generateNextInvoiceNumber_create
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: invoices_invoicing_generateNextInvoiceNumber_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error_400)
        STATUS: 400
        WHEN: Invalid request. (HTTP 400)
      - TYPE: STRUCT(error_403)
        STATUS: 403
        WHEN: Authorization Error. (HTTP 403)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: invoices.invoicing.generateNextInvoiceNumber.create
  invoices.invoicing.invoices.get:
