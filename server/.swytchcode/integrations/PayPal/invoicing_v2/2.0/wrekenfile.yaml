      type: STRUCT(error_409)
      REQUIRED: false
    - name: variant_error_415
      type: STRUCT(error_415)
      REQUIRED: false
    - name: variant_error_422
      type: STRUCT(error_422)
      REQUIRED: false
    - name: variant_error_500
      type: STRUCT(error_500)
      REQUIRED: false
    - name: variant_error_503
      type: STRUCT(error_503)
      REQUIRED: false
  fetchtype:
    - name: fetch_id
      type: BOOL
      REQUIRED: false
      comment: Optional to decide the number or ID.
  invoice:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the invoice.
    - name: parent_id
      type: STRING
      REQUIRED: false
      comment: The parent ID to an invoice that defines the group invoice to which the invoice is related.
    - name: status
      type: STRING
      REQUIRED: false
    - name: detail
      type: OBJECT
      REQUIRED: true
      comment: The details of the invoice. Includes the invoice number, date, payment terms, and audit metadata.
    - name: invoicer
      type: OBJECT
      REQUIRED: false
      comment: The invoicer information. Includes the business name, email, address, phone, fax, tax ID, additional notes, and logo URL.
    - name: primary_recipients
      type: ANY
      REQUIRED: false
    - name: additional_recipients
      type: ANY
      REQUIRED: false
    - name: items
      type: ANY
      REQUIRED: false
    - name: configuration
      type: OBJECT
      REQUIRED: false
      comment: The invoice configuration details. Includes partial payment, tip, and tax calculated after discount.
    - name: amount
      type: STRUCT(amount_summary_detail)
      REQUIRED: false
      comment: The invoice amount summary of item total, discount, tax total and shipping..
    - name: due_amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The due amount, which is the balance amount outstanding after payments.
    - name: gratuity
      type: STRUCT(money)
      REQUIRED: false
      comment: The amount paid by the payer as gratuity to the invoicer.
    - name: payments
      type: STRUCT(payments)
      REQUIRED: false
      comment: List of payments registered against the invoice..
    - name: refunds
      type: STRUCT(refunds)
      REQUIRED: false
      comment: List of refunds against this invoice. The invoicing refund details includes refund type, date, amount, and method.
    - name: links
      type: ANY
      REQUIRED: false
  payments:
    - name: paid_amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The aggregated payment amounts against this invoice.
    - name: transactions
      type: ANY
      REQUIRED: false
  payment_detail:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The payment type in an invoicing flow which can be PayPal or an external cash or check payment.
    - name: payment_id
      type: STRING
      REQUIRED: false
      comment: The ID for a PayPal payment transaction. Required for the `PAYPAL` payment type.
    - name: payment_date
      type: STRING
      REQUIRED: false
      comment: The date when the invoice was paid, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). For example, *yyyy*-*MM*-*dd* *z*.
    - name: method
      type: STRING
      REQUIRED: true
      comment: The payment mode or method through which the invoicer can accept the payment.
    - name: note
      type: STRING
      REQUIRED: false
      comment: A note associated with an external cash or check payment.
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The payment amount to record against the invoice. If you omit this parameter, the total invoice amount is marked as paid. This amount cannot exceed the amount due.
    - name: shipping_info
      type: OBJECT
      REQUIRED: false
      comment: The recipient's shipping information. Includes the user's contact information, which includes name and address.
  refunds:
    - name: refund_amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The aggregated refund amounts.
    - name: transactions
      type: ANY
      REQUIRED: false
  refund_detail:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The PayPal refund type. Indicates whether the refund was paid through PayPal or externally in the invoicing flow. The record refund method supports the `EXTERNAL` refund type. The `PAYPAL` refund type is supported for backward compatibility.
    - name: refund_id
      type: STRING
      REQUIRED: false
      comment: The ID for a PayPal payment transaction. Required for the `PAYPAL` payment type.
    - name: refund_date
      type: STRING
      REQUIRED: false
      comment: The date when the invoice was refunded, in [Internet date format](https://tools.ietf.org/html/rfc3339#section-5.6). For example, `2014-02-27`.
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The amount to record as refunded. If you omit the amount, the total invoice paid amount is recorded as refunded.
    - name: method
      type: STRING
      REQUIRED: true
      comment: The payment mode or method through which the invoicer can accept the payments.
  link_description:
    - name: href
      type: STRING
      REQUIRED: true
      comment: The complete target URL. To make the related call, combine the method with this [URI Template-formatted](https://tools.ietf.org/html/rfc6570) link. For pre-processing, include the `$`, `(`, and `)` characters. The `href` is the key HATEOAS component that links a completed call with a subsequent call.
    - name: rel
      type: STRING
      REQUIRED: true
      comment: The [link relation type](https://tools.ietf.org/html/rfc5988#section-4), which serves as an ID for a link that unambiguously describes the semantics of the link. See [Link Relations](https://www.iana.org/assignments/link-relations/link-relations.xhtml).
    - name: method
      type: STRING
      REQUIRED: false
      comment: The HTTP method required to make the related call.
  invoice_connection_details:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the invoice. This property supports Unicode.
    - name: connection_status
      type: ANY
      REQUIRED: false
  invoice_number:
    - name: invoice_number
      type: STRING
      REQUIRED: false
      comment: The invoice number. If you omit this value, the default is the auto-incremented number from the last number.
    - name: invoice_id
      type: STRING
      REQUIRED: false
      comment: Resource Id.
  invoices:
    - name: total_pages
      type: INT
      REQUIRED: false
      comment: The total number of pages that are available for the search criteria. <blockquote><strong>Note:</strong> Clients MUST NOT assume that the value of total_pages is constant. The value MAY change from one request to the next</blockquote>
    - name: total_items
      type: INT
      REQUIRED: false
      comment: The total number of invoices that match the search criteria.<blockquote><strong>Note:</strong> Clients MUST NOT assume that the value of <code>total_items</code> is constant. The value MAY change from one request to the next.</blockquote>
    - name: items
      type: ANY
      REQUIRED: false
    - name: links
      type: ANY
      REQUIRED: false
  notification:
    - name: subject
      type: STRING
      REQUIRED: false
      comment: The subject of the email that is sent as a notification to the recipient.<blockquote><strong>Note:</strong> User-provided values for this field will not be honored and the subject will always be defaulted to a system-defined value.</blockquote>
    - name: note
      type: STRING
      REQUIRED: false
      comment: A note to the payer.<blockquote><strong>Note:</strong> User-provided values for this field will not be honored and the note will always be defaulted to a system-defined value.</blockquote>
    - name: send_to_invoicer
      type: BOOL
      REQUIRED: false
      comment: Indicates whether to send a copy of the email to the merchant.
    - name: send_to_recipient
      type: BOOL
      REQUIRED: false
      comment: Indicates whether to send a copy of the email to the recipient.
    - name: additional_recipients
      type: ANY
      REQUIRED: false
  payment_reference:
    - name: payment_id
      type: STRING
      REQUIRED: false
      comment: The ID for the invoice payment.
  qr_config:
    - name: width
      type: INT
      REQUIRED: false
      comment: The width, in pixels, of the QR code image. Value is from `150` to `500`.
    - name: height
      type: INT
      REQUIRED: false
      comment: The height, in pixels, of the QR code image. Value is from `150` to `500`.
    - name: action
      type: STRING
      REQUIRED: false
      comment: The type of URL for which to generate a QR code. Valid values are `pay` and `details`.
  refund_reference:
    - name: refund_id
      type: STRING
      REQUIRED: false
      comment: The ID of the refund of an invoice payment.
  search_data:
    - name: recipient_email
      type: STRING
      REQUIRED: false
      comment: Filters the search by the email address.
    - name: recipient_first_name
      type: STRING
      REQUIRED: false
      comment: Filters the search by the recipient first name.
    - name: recipient_last_name
      type: STRING
      REQUIRED: false
      comment: Filters the search by the recipient last name.
    - name: recipient_business_name
      type: STRING
      REQUIRED: false
      comment: Filters the search by the recipient business name.
    - name: invoice_number
      type: STRING
      REQUIRED: false
      comment: Filters the search by the invoice number.
    - name: status
      type: ANY
      REQUIRED: false
    - name: reference
      type: STRING
      REQUIRED: false
      comment: The reference data. Includes a Purchase Order (PO) number.
    - name: currency_code
      type: STRING
      REQUIRED: false
      comment: The [three-character ISO-4217 currency code](/docs/integration/direct/rest/currency-codes/) that identifies the currency.
    - name: memo
      type: STRING
      REQUIRED: false
      comment: A private bookkeeping memo for the user.
    - name: total_amount_range
      type: STRUCT(amount_range)
      REQUIRED: false
      comment: Filters the search by the total amount.
    - name: invoice_date_range
      type: STRUCT(date_range)
      REQUIRED: false
      comment: Filters the search by a date range for the invoice, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
    - name: due_date_range
      type: STRUCT(date_range)
      REQUIRED: false
      comment: Filters the search by a due date range for the invoice, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
    - name: payment_date_range
      type: STRUCT(date_time_range)
      REQUIRED: false
    - name: creation_date_range
      type: STRUCT(date_time_range)
      REQUIRED: false
      comment: Filters the search by a creation date range for the invoice, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
    - name: archived
      type: BOOL
      REQUIRED: false
      comment: Indicates whether to list merchant-archived invoices in the response. Value is:<ul><li><code>true</code>. Response lists only merchant-archived invoices.</li><li><code>false</code>. Response lists only unarchived invoices.</li><li><code>null</code>. Response lists all invoices.</li></ul>
    - name: fields
      type: ANY
      REQUIRED: false
  template:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the template.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The template name.<blockquote><strong>Note:</strong> The template name must be unique.</blockquote>
    - name: default_template
      type: BOOL
      REQUIRED: false
      comment: Indicates whether this template is the default template. A invoicer can have one default template.
    - name: template_info
      type: STRUCT(template_info)
      REQUIRED: false
      comment: The template details. Includes invoicer business information, invoice recipients, items, and configuration.
    - name: settings
      type: STRUCT(template_settings)
      REQUIRED: false
      comment: The template settings. Describes which fields to show or hide when you create an invoice.
    - name: unit_of_measure
      type: STRING
      REQUIRED: false
      comment: The unit of measure for the template. Value is quantity, hours, or amount.
    - name: standard_template
      type: BOOL
      REQUIRED: false
      comment: Indicates whether this template is a invoicer-created custom template. The system generates non-custom templates.
    - name: links
      type: ANY
      REQUIRED: false
  template_info:
    - name: detail
      type: OBJECT
      REQUIRED: false
      comment: The template-related details. Includes notes, terms and conditions, memo, and attachments.
    - name: invoicer
      type: OBJECT
      REQUIRED: false
      comment: The invoicer information. Includes business name, email, address, phone, fax, tax ID, additional notes, and logo URL.
    - name: primary_recipients
      type: ANY
      REQUIRED: false
    - name: additional_recipients
      type: ANY
      REQUIRED: false
    - name: items
      type: ANY
      REQUIRED: false
    - name: configuration
      type: STRUCT(template_configuration)
      REQUIRED: false
      comment: The template configuration details. Includes tax information, tip, and partial payment.
    - name: amount
      type: STRUCT(amount_summary_detail)
      REQUIRED: false
      comment: The invoice amount summary of the item total, discount, tax total, and shipping.
    - name: due_amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The amount due for the invoice.
  template_settings:
    - name: template_item_settings
      type: ANY
      REQUIRED: false
    - name: template_subtotal_settings
      type: ANY
      REQUIRED: false
  templates:
    - name: addresses
      type: ANY
      REQUIRED: false
    - name: emails
      type: STRING
      REQUIRED: false
      comment: An array of emails in the user's PayPal profile.
    - name: phones
      type: ANY
      REQUIRED: false
    - name: templates
      type: ANY
      REQUIRED: false
    - name: links
      type: ANY
      REQUIRED: false
