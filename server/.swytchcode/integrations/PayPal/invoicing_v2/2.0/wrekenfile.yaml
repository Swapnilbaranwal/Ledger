STRUCTS:
  aggregated_discount:
    - name: invoice_discount
      type: STRUCT(discount)
      REQUIRED: false
      comment: The discount as a percent or amount at invoice level. The invoice discount amount is subtracted from the item total.
    - name: item_discount
      type: STRUCT(money)
      REQUIRED: false
      comment: The discount as a percent or amount at item level. The item discount amount is subtracted from each item amount.
  discount:
    - name: percent
      type: STRING
      REQUIRED: false
      comment: The discount as a percentage value. Value is from `0` to `100`. Supports up to five decimal places.
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The invoice level discount amount. Value is from `0` to `1000000`. Supports up to two decimal places.
  money:
    - name: currency_code
      type: STRING
      REQUIRED: true
    - name: value
      type: STRING
      REQUIRED: true
      comment: The value, which might be:<ul><li>An integer for currencies like `JPY` that are not typically fractional.</li><li>A decimal fraction for currencies like `TND` that are subdivided into thousandths.</li></ul>For the required number of decimal places for a currency code, see [Currency Codes](/api/rest/reference/currency-codes/).
  amount_range:
    - name: lower_amount
      type: STRUCT(money)
      REQUIRED: true
      comment: The lower limit of the amount range.
    - name: upper_amount
      type: STRUCT(money)
      REQUIRED: true
      comment: The upper limit of the amount range.
  amount_summary_detail:
    - name: currency_code
      type: STRING
      REQUIRED: false
    - name: value
      type: STRING
      REQUIRED: false
      comment: The value, which might be:<ul><li>An integer for currencies like `JPY` that are not typically fractional.</li><li>A decimal fraction for currencies like `TND` that are subdivided into thousandths.</li></ul>For the required number of decimal places for a currency code, see [Currency Codes](/docs/integration/direct/rest/currency-codes/).
    - name: breakdown
      type: STRUCT(amount_with_breakdown)
      REQUIRED: false
      comment: The breakdown of the amount. Breakdown provides details such as total item amount, total tax amount, custom amount, shipping and discounts, if any.
  amount_with_breakdown:
    - name: item_total
      type: STRUCT(money)
      REQUIRED: false
      comment: The subtotal for all items. Must equal the sum of (`items[].unit_amount` * `items[].quantity`) for all items.
    - name: discount
      type: STRUCT(aggregated_discount)
      REQUIRED: false
      comment: The discount can be at the item or invoice level, or both. Can be applied as a percent or amount. If you provide both amount and percent, amount takes precedent.
    - name: tax_total
      type: STRUCT(money)
      REQUIRED: false
      comment: The aggregated amount of the item and shipping taxes.
    - name: shipping
      type: STRUCT(shipping_cost)
      REQUIRED: false
      comment: The shipping fee for all items. Includes tax on shipping.
    - name: custom
      type: STRUCT(custom_amount)
      REQUIRED: false
      comment: The custom amount to apply to an invoice. If you include a label, you must include the custom amount.
  shipping_cost:
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The shipping amount. Value is from `0` to `1000000`. Supports up to two decimal places.
    - name: tax
      type: STRUCT(tax)
      REQUIRED: false
      comment: The tax associated with the shipping.
  tax:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the tax applied on the invoice items.
    - name: percent
      type: STRING
      REQUIRED: true
      comment: The tax rate. Value is from `0` to `100`. Supports up to five decimal places.
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The calculated tax amount. The tax amount is added to the item total.
    - name: tax_note
      type: STRING
      REQUIRED: false
      comment: The tax note used to track the tax related data.
  custom_amount:
    - name: label
      type: STRING
      REQUIRED: true
      comment: The label to the custom amount of the invoice.
    - name: amount
      type: STRUCT(money)
      REQUIRED: false
      comment: The custom amount value. Value is from `-1000000` to `1000000`. Supports up to two decimal places.
  template_configuration:
    - name: tax_calculated_after_discount
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the tax is calculated before or after a discount. If `false`, the tax is calculated before a discount. If `true`, the tax is calculated after a discount.
    - name: tax_inclusive
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the unit price includes tax.
    - name: allow_tip
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the invoice enables the customer to enter a tip amount during payment. If `true`, the invoice shows a tip amount field so that the customer can enter a tip amount. If `false`, the invoice does not show a tip amount field.<blockquote><strong>Note:</strong> This feature is not available for users in `Hong Kong`, `Taiwan`, `India`, or `Japan`.</blockquote>
    - name: partial_payment
      type: STRUCT(partial_payment)
      REQUIRED: false
      comment: The partial payment details. Includes the minimum amount that the invoicer wants the payer to pay.
    - name: has_conditional_rule
      type: BOOL
      REQUIRED: false
      comment: Indicates whether conditional pricing rules are applied to the invoice. If `true`, pricing rules (such as discounts or surcharges based on specific conditions) are applied. If `false`, no conditional pricing rules are applied.
  partial_payment:
    - name: allow_partial_payment
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the invoice allows a partial payment. If `false`, the invoice must be paid in full. If `true`, the invoice allows partial payments.<blockquote><strong>Note:</strong> This feature is not available for users in `India`, `Brazil`, or `Israel`.</blockquote>
    - name: minimum_amount_due
      type: STRUCT(money)
      REQUIRED: false
      comment: The minimum amount allowed for a partial payment. Valid only when `allow_partial_payment` is `true`.
  connections:
    - name: connections
      type: ANY
      REQUIRED: false
  date_range:
    - name: start
      type: STRING
      REQUIRED: true
      comment: The start date of the range. Filters invoices by creation date, invoice date, due date, and payment date.
    - name: end
      type: STRING
      REQUIRED: true
      comment: The end date of the range. Filters invoices by creation date, invoice date, due date, and payment date.
  date_time_range:
    - name: start
      type: STRING
      REQUIRED: true
      comment: The start date of the range. Filters invoices by creation date, invoice date, due date, and payment date.
    - name: end
      type: STRING
      REQUIRED: true
      comment: "The end date of the range. Filters invoices by creation date, invoice date, due date, and payment date. <blockquote><strong>Note: The regular expression provides guidance but does not reject all invalid dates.</strong></blockquote><br/>Minimum length: 20.<br/>Maximum length: 64<br/>Pattern: <code>^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$</code>"
  error_400:
    - name: name
      type: STRING
      REQUIRED: false
    - name: message
      type: STRING
      REQUIRED: false
    - name: details
      type: "[]STRUCT(error_details)"
      REQUIRED: false
    - name: debug_id
      type: STRING
      REQUIRED: false
      comment: The PayPal internal ID. Used for correlation purposes.
    - name: links
      type: "[]STRUCT(error_link_description)"
      REQUIRED: false
      comment: An array of request-related [HATEOAS links](https://en.wikipedia.org/wiki/HATEOAS).
  error_details:
    - name: field
      type: STRING
      REQUIRED: false
      comment: The field that caused the error. If this field is in the body, set this value to the field's JSON pointer value. Required for client-side errors.
    - name: value
      type: STRING
      REQUIRED: false
      comment: The value of the field that caused the error.
    - name: location
      type: STRING
      REQUIRED: false
    - name: issue
      type: STRING
      REQUIRED: true
      comment: The unique, fine-grained application-level error code.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The human-readable description for an issue. The description can change over the lifetime of an API, so clients must not depend on this value.
  error_link_description:
    - name: href
      type: STRING
      REQUIRED: true
      comment: The complete target URL. To make the related call, combine the method with this [URI Template-formatted](https://tools.ietf.org/html/rfc6570) link. For pre-processing, include the `$`, `(`, and `)` characters. The `href` is the key HATEOAS component that links a completed call with a subsequent call.
    - name: rel
