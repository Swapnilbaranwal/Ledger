VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://api-m.sandbox.paypal.com
METHODS:
  catalog_products.catalog.products.create:
    SUMMARY: Create product
    DESC: Creates a product.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/catalogs/products
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(product_request_POST)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Prefer:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: return=minimal
      - PayPal-Request-Id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(product_request_POST)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(product)
        RETURNVAR: catalog_products_catalog_products_create
        STATUS: 200
      - RETURNTYPE: STRUCT(product)
        RETURNVAR: catalog_products_catalog_products_create_201
        STATUS: 201
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: catalog_products_catalog_products_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(products.create_Error400)
        STATUS: 400
        WHEN: Bad Request. Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(products.create_Error401)
        STATUS: 401
        WHEN: Authentication failed due to missing authorization header, or invalid authentication credentials. (HTTP 401)
      - TYPE: STRUCT(products.create_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions. (HTTP 403)
      - TYPE: STRUCT(products.create_Error422)
        STATUS: 422
        WHEN: The requested action could not be performed, semantically incorrect, or failed business validation. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: catalog_products.catalog.products.create
  catalog_products.catalog.products.list:
    SUMMARY: List products
    DESC: Lists products.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/catalogs/products
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 10
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 1
      - total_required:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
    RETURNS:
      - RETURNTYPE: STRUCT(product_collection)
        RETURNVAR: catalog_products_catalog_products_list
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: catalog_products_catalog_products_list_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(products.list_Error400)
        STATUS: 400
        WHEN: Bad Request. Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(products.list_Error401)
        STATUS: 401
        WHEN: Authentication failed due to missing authorization header, or invalid authentication credentials. (HTTP 401)
      - TYPE: STRUCT(products.list_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions. (HTTP 403)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: catalog_products.catalog.products.list
  catalog_products.catalog.products.get:
    SUMMARY: Show product details
    DESC: Shows details for a product, by ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/catalogs/products/{product_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - product_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(product)
        RETURNVAR: catalog_products_catalog_products_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: catalog_products_catalog_products_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(products.get_Error401)
        STATUS: 401
        WHEN: Authentication failed due to missing authorization header, or invalid authentication credentials. (HTTP 401)
      - TYPE: STRUCT(products.get_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions. (HTTP 403)
      - TYPE: STRUCT(products.get_Error404)
        STATUS: 404
        WHEN: The specified resource does not exist. (HTTP 404)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: catalog_products.catalog.products.get
  catalog_products.catalog.products.update:
    SUMMARY: Update product
    DESC: Updates a product, by ID. You can patch these attributes and objects:<table><thead><tr><th>Attribute or object</th><th>Operations</th></tr></thead><tbody><tr><td><code>description</code></td><td>add, replace, remove</td></tr><tr><td><code>category</code></td><td>add, replace, remove</td></tr><tr><td><code>image_url</code></td><td>add, replace, remove</td></tr><tr><td><code>home_url</code></td><td>add, replace, remove</td></tr></tbody></table>
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v1/catalogs/products/{product_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: ANY
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - product_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: ANY
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(error_default)
        RETURNVAR: catalog_products_catalog_products_update_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(products.patch_Error400)
        STATUS: 400
        WHEN: Bad Request. Request is not well-formed, syntactically incorrect, or violates schema. (HTTP 400)
      - TYPE: STRUCT(products.patch_Error401)
        STATUS: 401
        WHEN: Authentication failed due to missing authorization header, or invalid authentication credentials. (HTTP 401)
      - TYPE: STRUCT(products.patch_Error403)
        STATUS: 403
        WHEN: Authorization failed due to insufficient permissions. (HTTP 403)
      - TYPE: STRUCT(products.patch_Error404)
        STATUS: 404
        WHEN: The specified resource does not exist. (HTTP 404)
      - TYPE: STRUCT(products.patch_Error422)
        STATUS: 422
        WHEN: The requested action could not be performed, semantically incorrect, or failed business validation. (HTTP 422)
      - TYPE: STRUCT(error_500)
        STATUS: 500
        WHEN: An internal server error has occurred. (HTTP 500)
      - TYPE: STRUCT(error_default)
        STATUS: 500
        WHEN: The default response. (HTTP default)
    CANONICAL_ID: catalog_products.catalog.products.update
